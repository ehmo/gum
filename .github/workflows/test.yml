name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/gum

jobs:
  # Single Go version, matching go.mod's `go 1.26` and every other workflow.
  # A second '1.25.x' leg used to run here, but go.mod requires 1.26: a 1.25
  # toolchain either refuses the module or (with the default GOTOOLCHAIN=auto)
  # silently downloads 1.26 and runs that. Either way the leg tested 1.26 while
  # reporting itself as 1.25 coverage, so it was removed rather than left to
  # imply a compatibility guarantee that does not exist.
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/gum/go.sum
      # gofmt drift is invisible to vet, staticcheck and golangci-lint's
      # default set; 71 files had accumulated drift before this gate existed.
      # gen/dispatch is generated and gitignored, so a fresh checkout has no
      # 50th package: `go test ./...` silently covered 49 and the stub
      # generator itself was never exercised by CI. This pass is offline (it
      # reads the embedded catalog, no Discovery fetch) and does not rewrite
      # catalog.json. Runs before vet so the stubs are vetted and linted too.
      #
      # `make stubs`, not `go generate ./gen/dispatch/...`: the //go:generate
      # directive lives in gen/dispatch/dispatch.go, inside the gitignored tree
      # it would create, so go generate cannot bootstrap a fresh checkout.
      - name: generate dispatch stubs
        run: make stubs
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          "$(go env GOPATH)"/bin/staticcheck ./...
      # vet and staticcheck both miss unchecked errors; errcheck (bundled in
      # golangci-lint's default set) is what found the dropped json.Unmarshal
      # in internal/lro and the dropped Fprintf returns in cmd/gum. Version is
      # pinned so a new upstream linter cannot turn a green branch red without
      # a deliberate bump.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: apps/gum
      - name: build
        run: go build ./...
      - name: test (race)
        run: go test -race -timeout 300s ./...

  # macOS leg: the auth package's keychain backend (zalando/go-keyring) and
  # file-permission / path behavior differ from Linux and are never otherwise
  # exercised in CI (review gum-662u). Scoped to platform-sensitive packages
  # to keep the run cheap.
  #
  # This job used to carry `if: github.repository != 'ehmo/gum' &&
  # github.event_name == 'pull_request'`. Both halves were wrong: work lands
  # on main by direct push, not by PR, so the job was skipped on every run it
  # had ever been scheduled for, and the repository guard would have kept it
  # off the one runner (public repo, free macOS minutes) where it costs
  # nothing. It is unguarded now so it actually gates.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/gum/go.sum
      - name: test (race, platform-sensitive packages)
        run: go test -race -timeout 300s ./internal/auth/... ./internal/config/... ./internal/initpkg/... ./internal/fsatomic/... ./cmd/gum/...

  # The installer is a supply-chain artifact; its smoke tests (checksum-verify
  # wiring, platform detection, PATH-conflict logic) run network-free via
  # GUM_DRY_RUN and were previously wired to no workflow (review gum-662u).
  install-script:
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: public release contract
        run: scripts/check-public-release-contract.py
      - name: install.sh smoke tests
        run: bash install_test.sh

  docs:
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/gum/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: docs site and command reference
        run: make docs-check
      # docs-check regenerates docs/commands and docs/services in place, so on
      # its own it can pass while the committed pages are stale. The `gum
      # plugin list` rewrite shipped with exactly that drift. Fail instead.
      - name: generated docs are committed
        run: |
          if ! git diff --exit-code -- docs/commands docs/services docs/commands.generated.md; then
            echo "::error::generated docs are stale; run 'make docs-check' and commit the result"
            exit 1
          fi

  coverage-floor:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Single toolchain: per-package coverage can drift fractionally
          # between Go minor versions, so the retention baselines in
          # internal/coverage.Ratchets are pinned to the version they were
          # measured on (matches go.mod's `go 1.26.x`).
          go-version: '1.26.x'
          cache-dependency-path: apps/gum/go.sum
      - name: per-package coverage retention gate
        # Fails the build if any tracked package regresses below its
        # floor(current-1%) baseline; prints RATCHET_OPPORTUNITY hints when
        # coverage has climbed enough to justify tightening a baseline.
        run: go run ./cmd/coverage-floor
