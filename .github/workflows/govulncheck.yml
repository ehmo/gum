name: govulncheck

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/gum

jobs:
  govulncheck:
    # GitHub-hosted runners cost nothing in ehmo/gum. Every other copy of
    # this workflow runs on Ubicloud.
    runs-on: ${{ github.repository == 'ehmo/gum' && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/gum/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: scan
        working-directory: .
        run: scripts/check-govulncheck.py --govulncheck "$(go env GOPATH)/bin/govulncheck"
